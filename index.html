<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>キオクライブ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Rampart+One&family=Reggae+One&family=Kaisei+Decol&family=New+Tegomin&display=swap');
  :root {
    --bg:#f7f5f0; --surface:#ffffff; --surface2:#f0ece4;
    --border:#e0d9ce; --border2:#ccc5b8;
    --text:#2c2620; --text2:#7a6f64; --text3:#aaa098;
    --accent:#8b6914; --accent2:#b58a2a;
    --green:#16a34a; --red:#dc2626; --yellow:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px 80px;}
  .container{width:100%;max-width:560px;}

  /* Header */
  .header{margin-bottom:24px;text-align:center;}
  .header h1{font-size:clamp(28px,8vw,40px);font-weight:700;letter-spacing:clamp(3px,2vw,8px);color:var(--accent);font-family:'New Tegomin',serif;line-height:1.2;}
  .header p{font-size:clamp(9px,2.5vw,11px);color:var(--text3);margin-top:8px;font-family:'DM Mono',monospace;letter-spacing:2px;}

  /* Card */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);margin-bottom:10px;}

  /* Step indicator */
  .step-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .step-badge{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step-title{font-size:14px;font-weight:600;color:var(--text);}
  .step-sub{font-size:11px;color:var(--text3);margin-top:1px;}

  /* Inputs */
  input[type="text"]{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;font-size:14px;font-family:'DM Mono',monospace;color:var(--text);outline:none;-webkit-appearance:none;}

  /* File upload - custom style for mobile */
  .upload-area{display:block;width:100%;border:2px dashed var(--border2);border-radius:12px;padding:24px 20px;text-align:center;cursor:pointer;position:relative;transition:border-color .15s,background .15s;}
  .upload-area:active{background:var(--surface2);}
  .upload-area input[type="file"]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
  .upload-icon{font-size:32px;margin-bottom:8px;}
  .upload-text{font-size:14px;font-weight:600;color:var(--text2);}
  .upload-sub{font-size:11px;color:var(--text3);margin-top:4px;}
  .upload-area.has-file{border-color:var(--accent2);border-style:solid;background:var(--surface2);}

  .note{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5;}
  .api-display{display:flex;align-items:center;justify-content:space-between;}
  .api-display span{font-size:12px;font-family:'DM Mono',monospace;color:var(--text3);}
  .btn-tiny{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:'Syne',sans-serif;min-height:36px;}

  /* Preview */
  .preview-wrap{border-radius:12px;overflow:hidden;background:#e8e4dc;margin-top:12px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;}
  .preview-wrap img,.preview-wrap video{max-width:100%;max-height:100%;object-fit:contain;display:block;}
  .preview-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:20px;}

  /* Preset grid - 2 cols on mobile, 3 on wider */
  .preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  @media(min-width:400px){.preset-grid{grid-template-columns:repeat(3,1fr);}}
  .preset-btn{padding:14px 8px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-family:'Syne',sans-serif;text-align:center;transition:all .15s;width:100%;line-height:1.5;-webkit-tap-highlight-color:transparent;}
  .preset-btn:active{transform:scale(.97);}
  .preset-btn.active{background:var(--surface2);border-color:var(--accent2);color:var(--accent);}
  .preset-name{font-size:12px;font-weight:600;display:block;margin-top:4px;}
  .preset-desc{font-size:10px;color:var(--text3);display:block;margin-top:2px;}
  .preset-btn.active .preset-desc{color:var(--text2);}

  /* Duration */
  .sep{height:1px;background:var(--border);margin:14px 0;}
  .dur-row{display:flex;gap:8px;}
  .dur-btn{flex:1;padding:12px 8px;border-radius:10px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-family:'Syne',sans-serif;transition:all .15s;min-height:44px;-webkit-tap-highlight-color:transparent;}
  .dur-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .dur-btn:active{transform:scale(.97);}

  /* Generate button - fixed bottom on mobile */
  .btn-generate-wrap{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(to bottom, transparent, var(--bg) 40%);}
  .btn-generate{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;background:var(--accent);color:#fff;transition:opacity .15s,transform .1s;letter-spacing:1px;min-height:52px;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 20px rgba(139,105,20,0.3);}
  .btn-generate:active{transform:scale(.98);}
  .btn-generate:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}

  /* Status */
  .status{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:10px;line-height:1.6;}
  .status.loading{background:#fffbeb;color:var(--yellow);border:1px solid #fde68a;}
  .status.success{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;}
  .status.error{background:#fef2f2;color:var(--red);border:1px solid #fecaca;}
  .status.info{background:#faf7f0;color:var(--accent);border:1px solid var(--border);}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;margin-top:4px;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .dot.anim{animation:pulse 1s ease-in-out infinite;}
  .progress{height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-top:6px;}
  @keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .progress-fill{height:100%;background:var(--yellow);animation:bar 1.4s ease-in-out infinite;}

  .download-btn{display:block;margin-top:10px;padding:14px;border-radius:10px;font-size:14px;font-family:'Syne',sans-serif;font-weight:600;background:var(--surface2);border:1px solid var(--border2);color:var(--accent);text-decoration:none;text-align:center;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>キオクライブ</h1>
    <p>静止画 → 動画生成 / fal.ai powered</p>
    <p style="font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:1px;">ver.1.0.006</p>
    <p style="font-size:11px;color:var(--text3);margin-top:6px;letter-spacing:1px;">作成者：みつを川西</p>
  </div>

  <!-- API Key -->
  <!-- API Key: 完全非表示 -->
  <input type="hidden" id="apiKey" value="ad625492-9c3f-4bba-b055-1e01edfb5557:19fa689ac4590f9bf415e0ec5351e942" />

  <!-- Photo upload -->
  <div class="card">
    <div class="card-label">写真を選択</div>
    <label class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
      <div id="uploadPlaceholder">
        <div class="upload-icon">📸</div>
        <div class="upload-text">タップして写真を選択</div>
        <div class="upload-sub">JPG / PNG / WEBP・最大10MB</div>
      </div>
    </label>
    <div id="previewArea" class="hidden">
      <div class="preview-wrap">
        <img id="previewImg" alt="プレビュー" />
        <span class="preview-badge" id="imgInfo"></span>
      </div>
    </div>
  </div>

  <!-- STEP 1: Photo style -->
  <div class="card">
    <div class="step-header">
      <div class="step-badge">1</div>
      <div>
        <div class="step-title">写真のスタイルを選ぶ <span id="step1check" style="font-size:14px;">○</span></div>
        <div class="step-sub">写真を変換してから動画を生成します</div>
      </div>
    </div>
    <div class="preset-grid" id="styleGrid">
      <button class="preset-btn active" data-style="none"
        onclick="selectStyle(this)">
        <span style="font-size:20px;">📷</span>
        <span class="preset-name">変換なし</span>
        <span class="preset-desc"></span>
      </button>
      <button class="preset-btn" data-style="anime"
        onclick="selectStyle(this)">
        <span style="font-size:20px;">✨</span>
        <span class="preset-name">アニメ</span>
        <span class="preset-desc">漫画風</span>
      </button>
      <button class="preset-btn" data-style="film8mm"
        onclick="selectStyle(this)">
        <span style="font-size:20px;">🎞️</span>
        <span class="preset-name">8mmフィルム</span>
        <span class="preset-desc">昭和レトロ</span>
      </button>
      <button class="preset-btn" data-style="mono"
        onclick="selectStyle(this)">
        <span style="font-size:20px;">⚫</span>
        <span class="preset-name">モノトーン</span>
        <span class="preset-desc">白黒に変換</span>
      </button>
      <button class="preset-btn" data-style="disney"
        onclick="selectStyle(this)">
        <span style="font-size:20px;">🏰</span>
        <span class="preset-name">ディズニー風</span>
        <span class="preset-desc">丸みのある顔</span>
      </button>
      <button class="preset-btn" data-style="oil"
        onclick="selectStyle(this)">
        <span style="font-size:20px;">🎨</span>
        <span class="preset-name">油絵風</span>
        <span class="preset-desc">絵画タッチ</span>
      </button>
    </div>
  </div>

  <div id="statusArea1"></div>

  <!-- STEP 2: Motion -->
  <div class="card">
    <div class="step-header">
      <div class="step-badge">2</div>
      <div>
        <div class="step-title">動きを選ぶ <span id="step2check" style="font-size:14px;">○</span></div>
        <div class="step-sub">写真にどんな動きをつけるか選んでください</div>
      </div>
    </div>
    <div class="preset-grid" id="motionGrid">
      <button class="preset-btn active"
        data-prompt="subtle motion, gentle breathing, soft wind, cinematic, high quality"
        onclick="selectMotion(this)">
        <span style="font-size:20px;">🕊️</span>
        <span class="preset-name">やわらかな風</span>
        <span class="preset-desc">穏やかな動き</span>
      </button>
      <button class="preset-btn"
        data-prompt="zoom out, camera pulling back, widening shot, subject shrinks in frame, dolly back, cinematic, high quality"
        onclick="selectMotion(this)">
        <span style="font-size:20px;">🔭</span>
        <span class="preset-name">ズームアウト</span>
        <span class="preset-desc">ゆっくり引いていく</span>
      </button>
      <button class="preset-btn"
        data-prompt="slow zoom in, camera slowly pushing in toward face, gradual close up, subject fills frame, dramatic reveal, cinematic push in, high quality"
        onclick="selectMotion(this)">
        <span style="font-size:20px;">🎭</span>
        <span class="preset-name">ドラマチック</span>
        <span class="preset-desc">顔にクローズアップ</span>
      </button>
      <button class="preset-btn"
        data-prompt="light rays, sparkling light, shimmering glow, bokeh effect, soft glowing particles, gentle light flicker, warm radiant light, cinematic, high quality"
        onclick="selectMotion(this)">
        <span style="font-size:20px;">✨</span>
        <span class="preset-name">きらめく</span>
        <span class="preset-desc">光がさすような動き</span>
      </button>
      <button class="preset-btn"
        data-prompt="slow cinematic pan, slow horizontal camera movement, film-like motion, steady camera glide, widescreen cinematic, slow dolly shot, high quality"
        onclick="selectMotion(this)">
        <span style="font-size:20px;">🎬</span>
        <span class="preset-name">シネマ</span>
        <span class="preset-desc">映画的なパン</span>
      </button>
      <button class="preset-btn"
        data-prompt="wind blowing through hair and clothes, flowing fabric, natural breeze, gentle hair motion, soft wind effect, cinematic, high quality"
        onclick="selectMotion(this)">
        <span style="font-size:20px;">💨</span>
        <span class="preset-name">風の中で</span>
        <span class="preset-desc">髪や服がなびく</span>
      </button>
    </div>

    <div class="sep"></div>

    <div class="card-label">動画の長さ</div>
    <div class="dur-row">
      <button class="dur-btn active" data-frames="81" data-fps="16" onclick="selectDuration(this)">5秒</button>
      <button class="dur-btn" data-frames="81" data-fps="8" onclick="selectDuration(this)">10秒</button>
    </div>
    <div class="note" style="margin-top:6px;">長いほど生成時間とコストが増加します。</div>
  </div>

  <div id="statusArea2"></div>
  <div class="btn-generate-wrap">
    <button class="btn-generate" id="generateBtn" onclick="generate()" disabled>動画を生成する</button>
  </div>

  <div id="resultArea" class="hidden" style="margin-top:12px;">
    <div class="card">
      <div class="card-label">生成結果</div>
      <div class="preview-wrap">
        <video id="resultVideo" controls loop playsinline style="width:100%;"></video>
      </div>
      <button class="download-btn" id="downloadBtn" onclick="downloadVideo()">📥 動画をダウンロード</button>

    </div>
  </div>

</div>
<script>
  const DEFAULT_API_KEY = 'ad625492-9c3f-4bba-b055-1e01edfb5557:19fa689ac4590f9bf415e0ec5351e942';
  let step1Selected = false;
  let step2Selected = false;

  // 初期状態：動きグリッドを無効化
  window.addEventListener('DOMContentLoaded', () => {
    setMotionGridEnabled(false);
  });
  let imageDataUrl = null;
  let currentStyle = 'none';
  let currentPrompt = 'subtle motion, gentle breathing, soft wind, cinematic, high quality';

  function setMotionGridEnabled(enabled) {
    document.querySelectorAll('#motionGrid .preset-btn').forEach(btn => {
      btn.disabled = !enabled;
      btn.style.opacity = enabled ? '1' : '0.4';
      btn.style.pointerEvents = enabled ? 'auto' : 'none';
    });
    document.querySelectorAll('.dur-btn').forEach(btn => {
      btn.disabled = !enabled;
      btn.style.opacity = enabled ? '1' : '0.4';
      btn.style.pointerEvents = enabled ? 'auto' : 'none';
    });
  }

  function checkReady() {
    const btn = document.getElementById('generateBtn');
    const ready = !!imageDataUrl && step1Selected && step2Selected;
    btn.disabled = !ready;
    // ステップ完了インジケーター更新
    document.getElementById('step1check').textContent = step1Selected ? '✅' : '○';
    document.getElementById('step2check').textContent = step2Selected ? '✅' : '○';
    if (ready) {
      btn.style.opacity = '1';
      btn.textContent = '動画を生成する';
    } else {
      btn.style.opacity = '0.4';
      const missing = [];
      if (!imageDataUrl) missing.push('写真');
      if (!step1Selected) missing.push('STEP1');
      if (!step2Selected) missing.push('STEP2');
      btn.textContent = `${missing.join('・')}を選んでください`;
    }
  }

  function toggleApiKey() {
    document.getElementById('apiKeyEdit').classList.toggle('hidden');
    document.getElementById('apiKeyDisplay').classList.toggle('hidden');
  }

  function getApiKey() {
    const el = document.getElementById('apiKey');
    const v = el ? el.value.trim() : '';
    return v.length > 10 ? v : DEFAULT_API_KEY;
  }

  // File input
  document.getElementById('fileInput').addEventListener('change', function() {
    const file = this.files && this.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { showStatus('error', '10MB以下の画像を使用してください', false); return; }
    const reader = new FileReader();
    reader.onload = e => {
      imageDataUrl = e.target.result;
      window._convertedImageUrl = null;
      document.getElementById('previewImg').src = imageDataUrl;
      document.getElementById('imgInfo').textContent = file.name.slice(0, 20);
      document.getElementById('previewArea').classList.remove('hidden');
      const area = document.getElementById('uploadArea');
      area.classList.add('has-file');
      document.getElementById('uploadPlaceholder').innerHTML = `<div class="upload-icon">✅</div><div class="upload-text">${file.name.slice(0,20)}</div><div class="upload-sub">タップして変更</div>`;
      showStatus('info', '👆 STEP1：写真のスタイルを選んでください', false, 'statusArea1');
      // 動きグリッドを無効化
      setMotionGridEnabled(false);
      step1Selected = false;
      step2Selected = false;
      checkReady();
    };
    reader.readAsDataURL(file);
  });

  function selectStyle(btn) {
    document.querySelectorAll('#styleGrid .preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStyle = btn.dataset.style;
    if (imageDataUrl) previewStyle(currentStyle);
  }

  async function previewStyle(style) {
    const previewImg = document.getElementById('previewImg');
    if (style === 'none') {
      previewImg.src = imageDataUrl;
      // 即完了
      step1Selected = true;
      setMotionGridEnabled(true);
      showStatus('info', '👆 STEP2：動きを選んでください', false, 'statusArea1');
      checkReady();
      return;
    }
    if (style === 'mono') {
      previewImg.src = await toGrayscale(imageDataUrl);
      step1Selected = true;
      setMotionGridEnabled(true);
      showStatus('info', '👆 STEP2：動きを選んでください', false, 'statusArea1');
      checkReady();
    } else if (style === 'disney') {
      const apiKey = getApiKey();
      showStatus('loading', '🏰 ディズニー風に変換中...（20〜40秒）', true, 'statusArea1');
      try {
        const url = await convertWithFlux(imageDataUrl, 'Convert this photo into Disney animation style. Soft rounded facial features, large expressive eyes, warm vibrant colors, smooth cel shading, Disney Pixar character style, charming and friendly appearance, high quality.', apiKey);
        previewImg.src = url;
        window._convertedImageUrl = url;
        showStatus('info', '🏰 変換完了！確認してから「動画を生成する」を押してください', false, 'statusArea1');
      } catch(e) {
        previewImg.src = imageDataUrl;
        showStatus('error', '変換失敗: ' + e.message, false, 'statusArea1');
      }
    } else if (style === 'film8mm') {
      previewImg.src = await toFilm8mm(imageDataUrl);
      step1Selected = true;
      setMotionGridEnabled(true);
      showStatus('info', '👆 STEP2：動きを選んでください', false, 'statusArea1');
      checkReady();
    } else if (style === 'anime' || style === 'oil') {
      const apiKey = getApiKey();
      const label = style === 'anime' ? 'アニメ風' : '油絵風';
      const prompt = style === 'anime'
        ? 'Convert this photo into webtoon anime illustration style. Clean lineart, vibrant colors, beautiful detailed face, soft cel shading, manhwa korean comic style. Keep the same person and pose.'
        : 'Convert this photo into oil painting style. Thick visible brushstrokes, rich colors, painterly texture, impressionist style, fine art oil painting, detailed, high quality.';
      showStatus('loading', `✨ ${label}に変換中...（20〜40秒）`, true, 'statusArea1');
      try {
        const convertedUrl = await convertWithFlux(imageDataUrl, prompt, apiKey);
        previewImg.src = convertedUrl;
        // 変換済み画像をキャッシュして生成時に再利用
        window._convertedImageUrl = convertedUrl;
        showStatus('info', `✨ 変換完了！確認してから「動画を生成する」を押してください`, false, 'statusArea1');
      } catch(e) {
        previewImg.src = imageDataUrl;
        showStatus('error', '変換失敗: ' + e.message, false, 'statusArea1');
      }
    }
  }

  function selectMotion(btn) {
    document.querySelectorAll('#motionGrid .preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPrompt = btn.dataset.prompt;
    step2Selected = true;
    showStatus('info', '✅ 準備完了！「動画を生成する」を押してください', false, 'statusArea1');
    checkReady();
  }

  function selectDuration(btn) {
    document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function showStatus(type, msg, loading, area) {
    const el = document.getElementById(area || 'statusArea2');
    if (!el) return;
    el.innerHTML = `
      <div class="status ${type}">
        <div class="dot ${loading ? 'anim' : ''}"></div>
        <div>
          <div>${msg}</div>
          ${loading ? '<div class="progress"><div class="progress-fill"></div></div>' : ''}
        </div>
      </div>`;
  }

  function clearStatus1() { const el = document.getElementById('statusArea1'); if(el) el.innerHTML=''; }
  function clearStatus2() { const el = document.getElementById('statusArea2'); if(el) el.innerHTML=''; }

  // Canvas: グレースケール変換
  function toGrayscale(dataUrl) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < d.data.length; i += 4) {
          const g = 0.299*d.data[i] + 0.587*d.data[i+1] + 0.114*d.data[i+2];
          d.data[i] = d.data[i+1] = d.data[i+2] = g;
        }
        ctx.putImageData(d, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.95));
      };
      img.src = dataUrl;
    });
  }


  // Canvas: 8mmフィルム変換（温かいセピア）
  function toFilm8mm(dataUrl) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < d.data.length; i += 4) {
          const r = d.data[i], g = d.data[i+1], b = d.data[i+2];
          // 強めのセピア＋茶色みを強調
          d.data[i]   = Math.min(255, r * 0.85 + g * 0.25 + b * 0.05 + 30);
          d.data[i+1] = Math.min(255, r * 0.22 + g * 0.60 + b * 0.05 + 10);
          d.data[i+2] = Math.min(255, r * 0.05 + g * 0.08 + b * 0.42);
          // ノイズ追加
          const noise = (Math.random() - 0.5) * 20;
          d.data[i]   = Math.min(255, Math.max(0, d.data[i] + noise));
          d.data[i+1] = Math.min(255, Math.max(0, d.data[i+1] + noise));
          d.data[i+2] = Math.min(255, Math.max(0, d.data[i+2] + noise));
        }
        ctx.putImageData(d, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      };
      img.src = dataUrl;
    });
  }

  // fal.ai FLUX APIで変換（アニメ風・油絵風）
  async function convertWithFlux(dataUrl, prompt, apiKey) {
    showStatus('loading', '🎨 写真を変換中...（20〜40秒かかります）', true, 'statusArea1');

    // base64をそのまま送信（ストレージアップロード不要）
    const res = await fetch('https://fal.run/fal-ai/flux-pro/kontext', {
      method: 'POST',
      headers: { 'Authorization': `Key ${apiKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_url: dataUrl, prompt, guidance_scale: 3.5, num_images: 1 }),
    });
    const text = await res.text();
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = JSON.parse(text).detail || msg; } catch {}
      throw new Error('スタイル変換失敗: ' + msg);
    }
    let result;
    try { result = JSON.parse(text); } catch { throw new Error('レスポンス解析失敗: ' + text.slice(0,100)); }
    const url = result?.images?.[0]?.url || result?.image?.url || result?.output?.images?.[0]?.url;
    if (!url) throw new Error('変換画像URL取得失敗: ' + JSON.stringify(result).slice(0,150));
    return url;
  }

  // poll queue
  async function pollQueue(model, requestId, apiKey, label, maxSec, area) {
    for (let i = 0; i < Math.floor(maxSec/3); i++) {
      await new Promise(r => setTimeout(r, 3000));
      showStatus('loading', `${label} ${(i+1)*3}秒経過...`, true, area || 'statusArea2');
      try {
        const sRes = await fetch(`https://queue.fal.run/${model}/requests/${requestId}/status`, { headers: { 'Authorization': `Key ${apiKey}` } });
        const s = JSON.parse(await sRes.text());
        if (s.status === 'COMPLETED') {
          const rRes = await fetch(`https://queue.fal.run/${model}/requests/${requestId}`, { headers: { 'Authorization': `Key ${apiKey}` } });
          return JSON.parse(await rRes.text());
        }
        if (s.status === 'FAILED') throw new Error(s.error || '生成失敗');
      } catch(e) { if (e.message.includes('失敗')) throw e; }
    }
    throw new Error(`タイムアウト（${maxSec}秒）`);
  }

  async function generate() {
    const apiKey = getApiKey();
    const activeDur = document.querySelector('.dur-btn.active');
    const num_frames = parseInt(activeDur?.dataset.frames || 81);
    const frames_per_second = parseInt(activeDur?.dataset.fps || 16);

    document.getElementById('generateBtn').disabled = true;
    document.getElementById('resultArea').classList.add('hidden');


    try {
      let imageUrl = imageDataUrl;

      // STEP 1: スタイル変換
      if (currentStyle === 'mono') {
        showStatus('loading', '⚫ モノクロに変換中...', true, 'statusArea1');
        imageUrl = await toGrayscale(imageDataUrl);
        document.getElementById('previewImg').src = imageUrl;

      } else if (currentStyle === 'disney') {
        if (window._convertedImageUrl) {
          imageUrl = window._convertedImageUrl;
        } else {
          imageUrl = await convertWithFlux(imageDataUrl, 'Convert this photo into Disney animation style. Soft rounded facial features, large expressive eyes, warm vibrant colors, smooth cel shading, Disney Pixar character style, charming and friendly appearance, high quality.', getApiKey());
          document.getElementById('previewImg').src = imageUrl;
        }

      } else if (currentStyle === 'film8mm') {
        showStatus('loading', '🎞️ 8mmフィルム風に変換中...', true, 'statusArea1');
        imageUrl = await toFilm8mm(imageDataUrl);
        document.getElementById('previewImg').src = imageUrl;

      } else if (currentStyle === 'anime' || currentStyle === 'oil') {
        // プレビュー時に変換済みならキャッシュを使用
        if (window._convertedImageUrl) {
          imageUrl = window._convertedImageUrl;
        } else {
          const label = currentStyle === 'anime' ? 'アニメ風' : '油絵風';
          const prompt = currentStyle === 'anime'
            ? 'Convert this photo into webtoon anime illustration style. Clean lineart, vibrant colors, beautiful detailed face, soft cel shading, manhwa korean comic style. Keep the same person and pose.'
            : 'Convert this photo into oil painting style. Thick visible brushstrokes, rich colors, painterly texture, impressionist style, fine art oil painting, detailed, high quality.';
          showStatus('loading', `✨ ${label}に変換中...（20〜40秒）`, true, 'statusArea1');
          imageUrl = await convertWithFlux(imageDataUrl, prompt, apiKey);
          document.getElementById('previewImg').src = imageUrl;
        }
      }

      // STEP 2: 動画生成
      clearStatus1(); showStatus('loading', '🎬 動画を生成中... リクエスト送信中', true, 'statusArea2');
      const MODEL = 'fal-ai/wan-i2v';
      const submitRes = await fetch(`https://queue.fal.run/${MODEL}`, {
        method: 'POST',
        headers: { 'Authorization': `Key ${apiKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_url: imageUrl, prompt: currentPrompt, num_frames, frames_per_second }),
      });
      const submitText = await submitRes.text();
      if (!submitRes.ok) {
        let msg = `HTTP ${submitRes.status}`;
        try { msg = JSON.parse(submitText).detail || msg; } catch {}
        throw new Error(msg);
      }
      const { request_id } = JSON.parse(submitText);
      if (!request_id) throw new Error('request_id なし');

      const result = await pollQueue(MODEL, request_id, apiKey, '🎬 動画生成中...', 360, 'statusArea2');
      const videoUrl =
        result?.video?.url ||
        result?.output?.video?.url ||
        result?.output?.video_url ||
        (Array.isArray(result?.output) ? result.output[0]?.url : null);
      if (!videoUrl) throw new Error('動画URL取得失敗: ' + JSON.stringify(result).slice(0,200));

      showStatus('success', '🎉 動画の生成が完了しました！', false, 'statusArea2');
      document.getElementById('resultVideo').src = videoUrl;
      window._videoUrl = videoUrl;
      document.getElementById('resultArea').classList.remove('hidden');
      document.getElementById('resultVideo').play().catch(() => {});

    } catch(err) {
      showStatus('error', 'エラー: ' + err.message, false, 'statusArea2');
    } finally {
      checkReady();
    }
  }
  async function downloadVideo() {
    const url = window._videoUrl;
    if (!url) return;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    if (isIOS) {
      const btn = document.getElementById('downloadBtn');
      btn.textContent = '⏳ 準備中...';
      btn.disabled = true;
      try {
        // プロキシ経由でBlobを取得
        const proxyUrl = `/api/proxy?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        const blob = await res.blob();
        const now = new Date();
        const pad = n => String(n).padStart(2,'0');
        const fname = `kiokulive_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.mp4`;
        const file = new File([blob], fname, { type: 'video/mp4' });

        // Web Share APIで写真に保存
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'キオクライブ' });
          showStatus('success', '✅ 共有メニューから「写真に保存」を選択してください', false, 'statusArea2');
        } else {
          // フォールバック：プロキシURLを新しいタブで開く
          window.open(proxyUrl, '_blank');
          showStatus('info', '📱 開いた動画の共有ボタン（↑）→「ビデオを保存」で保存できます', false, 'statusArea2');
        }
      } catch(e) {
        if (e.name !== 'AbortError') {
          const proxyUrl = `/api/proxy?url=${encodeURIComponent(url)}`;
          window.open(proxyUrl, '_blank');
        }
        showStatus('info', '📱 開いた動画の共有ボタン（↑）→「ビデオを保存」で保存できます', false, 'statusArea2');
      } finally {
        btn.textContent = '📥 動画をダウンロード';
        btn.disabled = false;
      }
      return;
    }

    // Android・PC: Blobダウンロード
    const btn = document.getElementById('downloadBtn');
    btn.textContent = '⏳ 準備中...';
    btn.disabled = true;
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      const now = new Date();
      const pad = n => String(n).padStart(2,'0');
      const fname = `kiokulive_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.mp4`;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
      btn.textContent = '📥 動画をダウンロード';
    } catch(e) {
      window.open(url, '_blank');
      btn.textContent = '📥 動画をダウンロード';
    } finally {
      btn.disabled = false;
    }
  }
